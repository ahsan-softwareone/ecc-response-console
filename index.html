<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ECC · Training</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23051530'/%3E%3Cpath d='M9 17h4l2-6 3 10 2-4h3' fill='none' stroke='%234fd1c5' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before paint so there is no flash. Mirrors src/ui/settings.ts.
      try {
        var s = JSON.parse(localStorage.getItem('ecc.settings') || '{}');
        var t = s.theme === 'light' || s.theme === 'dark' ? s.theme : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
        if (s.density) document.documentElement.setAttribute('data-density', s.density);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
